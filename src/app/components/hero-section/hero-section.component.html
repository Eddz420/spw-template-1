<section class="pt-24 lg:pt-32 pb-16 relative overflow-hidden">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
      <div class="space-y-8">
        <h1
          class="text-4xl md:text-6xl font-bold text-light-text dark:text-dark-text"
        >
          <span
            class="bg-clip-text text-transparent bg-gradient-to-r from-light-primary to-light-accent dark:from-dark-primary dark:to-dark-accent"
          >
            {{ 'company.slogan' | translate }} {{ config.company.name }}
        </span>
        </h1>
        <p class="text-lg text-light-text/80 dark:text-dark-text/80">
          {{ 'company.description' | translate }}
        </p>
        <button
          class="px-6 py-3 bg-light-primary dark:bg-dark-primary text-white rounded-lg hover:opacity-90 transition-opacity"
          >
          {{ 'cta.get-started' | translate }}
        </button>
      </div>
      <div
        class="relative transform hover:scale-105 transition-transform duration-300"
      >
        <div
          class="w-full h-[400px] md:h-[500px] rounded-2xl bg-gradient-to-r from-light-secondary to-light-accent dark:from-dark-secondary dark:to-dark-accent p-1 flex items-center justify-center"
        >
          <div
            class="w-full h-full rounded-xl bg-light-surface/90 dark:bg-dark-surface/90 flex items-center justify-center"
          >
            <span
              class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-light-primary to-light-accent dark:from-dark-primary dark:to-dark-accent"
            >
              {{ config.company.name }} + Tailwind
            </span>
          </div>
        </div>
        <div
          class="absolute inset-0 bg-gradient-to-r from-light-primary/20 to-transparent dark:from-dark-primary/20 rounded-2xl"
        ></div>
      </div>
    </div>
  </div>
</section>
