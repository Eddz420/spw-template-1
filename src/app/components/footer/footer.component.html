<footer class="bg-light-surface dark:bg-dark-surface">
  <div class="max-w-7xl px-4 sm:px-6 lg:px-8 py-12">
    <div
      class="flex flex-col md:flex-row justify-between items-center space-y-6 md:space-y-0"
    >
      <div>
        <span
          class="text-xl font-bold text-light-primary dark:text-dark-primary"
          >{{ config.company.name }}</span
        >
      </div>
      <div class="flex flex-wrap justify-center gap-6">
        <a
          *ngFor="let link of config.footer.links"
          [href]="link.path"
          class="text-light-text/80 dark:text-dark-text/80 hover:text-light-primary dark:hover:text-dark-primary transition-colors"
        >
          {{ link.label }}
        </a>
      </div>
    </div>
    <div class="mt-8 text-center text-light-text/60 dark:text-dark-text/60">
      {{ config.footer.copyright }}
    </div>
  </div>
</footer>
